name: in_app_file_view
description: "A Flutter plugin to view various file types such as PDFs, DOCs, PPTs, and Excel files."
version: 1.1.1
repository: https://github.com/harshrastogi-1/in_app_file_view
license: "MIT"

environment:
  sdk: ">=3.5.4 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: InAppFileViewPlugin
